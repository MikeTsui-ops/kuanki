services:
  app:
    image: mcr.microsoft.com/devcontainers/javascript-node:1-22-bookworm
    command: sleep infinity
    volumes:
      - ..:/workspaces/kuanki-website:cached
    environment:
      DATABASE_URL: postgresql://kuanki:kuanki_dev_only@db:5432/kuanki
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: kuanki
      POSTGRES_PASSWORD: kuanki_dev_only
      POSTGRES_DB: kuanki
    volumes:
      - kuanki-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kuanki -d kuanki"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  kuanki-postgres:

